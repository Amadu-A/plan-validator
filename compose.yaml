# compose.yaml
#
# Project-specific infrastructure и application services Plan Validator.
#
# Shared Ollama, RabbitMQ и n8n здесь намеренно не создаются: ими владеет
# repository shared_infrasktructure.

name: ${COMPOSE_PROJECT_NAME:-plan-validator}

x-default-logging: &default-logging
  driver: local
  options:
    max-size: ${PLAN_VALIDATOR_DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${PLAN_VALIDATOR_DOCKER_LOG_MAX_FILE:-5}

services:
  postgres:
    image: ${PLAN_VALIDATOR_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PLAN_VALIDATOR_POSTGRES_DB:-plan_validator}
      POSTGRES_USER: ${PLAN_VALIDATOR_POSTGRES_USER:-plan_validator}
      POSTGRES_PASSWORD: ${PLAN_VALIDATOR_POSTGRES_PASSWORD:?PLAN_VALIDATOR_POSTGRES_PASSWORD must be set in .env}

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_POSTGRES_HOST_PORT:-5438}:5432

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - private

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  qdrant:
    image: ${PLAN_VALIDATOR_QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    restart: unless-stopped

    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_QDRANT_HTTP_HOST_PORT:-6335}:6333
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_QDRANT_GRPC_HOST_PORT:-6336}:6334

    volumes:
      - qdrant-data:/qdrant/storage

    networks:
      - private

    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

    logging: *default-logging

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    environment:
      PLAN_VALIDATOR_SERVICE_NAME: api-gateway
      PLAN_VALIDATOR_SERVICE_VERSION: ${PLAN_VALIDATOR_SERVICE_VERSION:-0.1.0}
      PLAN_VALIDATOR_API_VERSION: ${PLAN_VALIDATOR_API_VERSION:-v1}
      PLAN_VALIDATOR_ENVIRONMENT: ${PLAN_VALIDATOR_ENVIRONMENT:-development}

      PLAN_VALIDATOR_GATEWAY__HOST: 0.0.0.0
      PLAN_VALIDATOR_GATEWAY__PORT: ${PLAN_VALIDATOR_GATEWAY__PORT:-8000}
      PLAN_VALIDATOR_GATEWAY__DOCS_ENABLED: ${PLAN_VALIDATOR_GATEWAY__DOCS_ENABLED:-true}

      PLAN_VALIDATOR_INTERNAL_HTTP__CONNECT_TIMEOUT_SECONDS: ${PLAN_VALIDATOR_INTERNAL_HTTP__CONNECT_TIMEOUT_SECONDS:-3}
      PLAN_VALIDATOR_INTERNAL_HTTP__READ_TIMEOUT_SECONDS: ${PLAN_VALIDATOR_INTERNAL_HTTP__READ_TIMEOUT_SECONDS:-30}

      PLAN_VALIDATOR_LOG_LEVEL: ${PLAN_VALIDATOR_LOG_LEVEL:-INFO}
      PLAN_VALIDATOR_LOG_ROOT_DIR: /var/log/plan-validator
      PLAN_VALIDATOR_LOG_TO_FILE: ${PLAN_VALIDATOR_LOG_TO_FILE:-true}
      PLAN_VALIDATOR_LOG_FILE_MAX_BYTES: ${PLAN_VALIDATOR_LOG_FILE_MAX_BYTES:-20971520}
      PLAN_VALIDATOR_LOG_FILE_BACKUP_COUNT: ${PLAN_VALIDATOR_LOG_FILE_BACKUP_COUNT:-7}
      PLAN_VALIDATOR_LOG_RETENTION_DAYS: ${PLAN_VALIDATOR_LOG_RETENTION_DAYS:-14}

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_GATEWAY_HOST_PORT:-8000}:${PLAN_VALIDATOR_GATEWAY__PORT:-8000}

    volumes:
      - ./var/log:/var/log/plan-validator

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c
          "import os, urllib.request;
          port=os.getenv('PLAN_VALIDATOR_GATEWAY__PORT', '8000');
          urllib.request.urlopen(
          f'http://127.0.0.1:{port}/health/live',
          timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

networks:
  private:
    name: ${PLAN_VALIDATOR_PRIVATE_NETWORK_NAME:-plan-validator-private}

  ai-shared:
    external: true
    name: ${PLAN_VALIDATOR_SHARED_NETWORK_NAME:-ai-shared}

volumes:
  postgres-data:
  qdrant-data: