    logging: *default-logging

  context-maintenance:
    image: plan-validator-context-service:local

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
