# compose.yaml
#
# Project-specific infrastructure и application services Plan Validator.
#
# Application configuration принадлежит Pydantic/.env.example.
# Compose отвечает только за deployment/container wiring.
#
# Shared Ollama, RabbitMQ и n8n здесь не создаются.

name: ${COMPOSE_PROJECT_NAME:-plan-validator}

x-default-logging: &default-logging
  driver: local
  options:
    max-size: ${PLAN_VALIDATOR_DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${PLAN_VALIDATOR_DOCKER_LOG_MAX_FILE:-5}

services:
  postgres:
    image: ${PLAN_VALIDATOR_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PLAN_VALIDATOR_POSTGRES_DB:-plan_validator}
      POSTGRES_USER: ${PLAN_VALIDATOR_POSTGRES_USER:-plan_validator}
      POSTGRES_PASSWORD: ${PLAN_VALIDATOR_POSTGRES_PASSWORD:?PLAN_VALIDATOR_POSTGRES_PASSWORD must be set in .env}

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_POSTGRES_HOST_PORT:-5438}:5432

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - private

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  qdrant:
    image: ${PLAN_VALIDATOR_QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    restart: unless-stopped

    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_QDRANT_HTTP_HOST_PORT:-6335}:6333
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_QDRANT_GRPC_HOST_PORT:-6336}:6334

    volumes:
      - qdrant-data:/qdrant/storage

    networks:
      - private

    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

    logging: *default-logging

  auth-service:
    image: plan-validator-auth-service:local

    build:
      context: .
      dockerfile: services/auth-service/Dockerfile

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./var/log:/app/var/log

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/live',
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  auth-migrate:
    image: plan-validator-auth-service:local

    profiles:
      - ops

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - alembic
      - -c
      - services/auth-service/alembic.ini
      - upgrade
      - head

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging: *default-logging

  catalog-service:
    image: plan-validator-catalog-service:local

    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./var/log:/app/var/log
      - ./data/catalog:/app/data/catalog

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/live',
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  catalog-migrate:
    image: plan-validator-catalog-service:local

    profiles:
      - ops

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - alembic
      - -c
      - services/catalog-service/alembic.ini
      - upgrade
      - head

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging: *default-logging

  catalog-outbox:
    image: plan-validator-catalog-service:local

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    command:
      - python
      - -m
      - catalog_service.infrastructure.messaging.dispatcher

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./var/log:/app/var/log

    networks:
      - private
      - ai-shared

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -m
        - catalog_service.infrastructure.messaging.healthcheck
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 20s

    logging: *default-logging

  embedding-service:
    image: plan-validator-embedding-service:local

    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
      target: api

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    expose:
      - "8000"

    volumes:
      - ./var/log:/app/var/log
      - embedding-model-cache:/models/huggingface:ro

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/ready',
          timeout=5).read()
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 15s

    logging: *default-logging

  embedding-worker:
    image: plan-validator-embedding-worker:local

    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
      target: gpu

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    command:
      - python
      - -m
      - embedding_service.infrastructure.messaging.worker

    gpus: all

    volumes:
      - ./var/log:/app/var/log
      - ./var/lock/plan-validator-gpu:/var/lock/plan-validator-gpu
      - embedding-model-cache:/models/huggingface:ro

    networks:
      - ai-shared

    read_only: true

    tmpfs:
      - /tmp:size=256m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -m
        - embedding_service.infrastructure.messaging.healthcheck
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

    stop_grace_period: 60s

    logging: *default-logging

  embedding-benchmark:
    image: plan-validator-embedding-service:local

    profiles:
      - ops

    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
      target: api

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
