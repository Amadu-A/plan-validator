# compose.yaml
#
# Project-specific infrastructure и application services Plan Validator.
#
# Application configuration принадлежит Pydantic/.env.example.
# Compose отвечает только за deployment/container wiring.
#
# Shared Ollama, RabbitMQ и n8n здесь не создаются.

name: ${COMPOSE_PROJECT_NAME:-plan-validator}

x-default-logging: &default-logging
  driver: local
  options:
    max-size: ${PLAN_VALIDATOR_DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${PLAN_VALIDATOR_DOCKER_LOG_MAX_FILE:-5}

services:
  postgres:
    image: ${PLAN_VALIDATOR_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PLAN_VALIDATOR_POSTGRES_DB:-plan_validator}
      POSTGRES_USER: ${PLAN_VALIDATOR_POSTGRES_USER:-plan_validator}
      POSTGRES_PASSWORD: ${PLAN_VALIDATOR_POSTGRES_PASSWORD:?PLAN_VALIDATOR_POSTGRES_PASSWORD must be set in .env}

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_POSTGRES_HOST_PORT:-5438}:5432

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - private

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  qdrant:
    image: ${PLAN_VALIDATOR_QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    restart: unless-stopped

    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_QDRANT_HTTP_HOST_PORT:-6335}:6333
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_QDRANT_GRPC_HOST_PORT:-6336}:6334

    volumes:
      - qdrant-data:/qdrant/storage

    networks:
      - private

    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

    logging: *default-logging

  auth-service:
    image: plan-validator-auth-service:local

    build:
      context: .
      dockerfile: services/auth-service/Dockerfile

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./var/log:/app/var/log

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/live',
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  auth-migrate:
    image: plan-validator-auth-service:local

    profiles:
      - ops

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - alembic
      - -c
      - services/auth-service/alembic.ini
      - upgrade
      - head

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging: *default-logging

  catalog-service:
    image: plan-validator-catalog-service:local

    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - ./var/log:/app/var/log
      - catalog-source-data:/app/data/uploads/catalog

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/live',
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

  catalog-migrate:
    image: plan-validator-catalog-service:local

    profiles:
      - ops

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - alembic
      - -c
      - services/catalog-service/alembic.ini
      - upgrade
      - head

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging: *default-logging

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile

    restart: unless-stopped

    user: >-
      ${PLAN_VALIDATOR_RUNTIME_UID:-1000}:${PLAN_VALIDATOR_RUNTIME_GID:-1000}

    ports:
      - >-
        ${PLAN_VALIDATOR_BIND_IP:-127.0.0.1}:${PLAN_VALIDATOR_GATEWAY_HOST_PORT:-8000}:8000

    volumes:
      - ./var/log:/app/var/log

    networks:
      - private

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/live',
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

networks:
  private:
    name: ${PLAN_VALIDATOR_PRIVATE_NETWORK_NAME:-plan-validator-private}

  ai-shared:
    external: true
    name: ${PLAN_VALIDATOR_SHARED_NETWORK_NAME:-ai-shared}

volumes:
  postgres-data:
  qdrant-data:
  catalog-source-data: