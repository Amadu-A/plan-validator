# packages/common/pyproject.toml
#
# Отдельный installable Python package с техническими primitives,
# переиспользуемыми микросервисами Plan Validator.
#
# Common package намеренно не зависит от FastAPI, SQLAlchemy, Celery,
# Qdrant или Ollama adapters.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "plan-validator-common"
version = "0.1.0"
description = "Общие технические primitives микросервисов Plan Validator."
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plan_validator_common"]