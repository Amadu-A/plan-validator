# services/auth-service/pyproject.toml
#
# Installable package Authentication bounded context Plan Validator.
#
# SQLAlchemy, Alembic и security adapters принадлежат infrastructure layer
# данного сервиса и не попадают в Domain/Application напрямую.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "plan-validator-auth-service"
version = "0.1.0"
description = "Authentication Service Plan Validator."
requires-python = ">=3.12,<3.15"
dependencies = [
    "plan-validator-common==0.1.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]