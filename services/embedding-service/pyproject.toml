# services/embedding-service/pyproject.toml
#
# Installable package Embedding Service Plan Validator.
# GPU dependencies вынесены в optional extra, чтобы Windows quality gate
# на Python 3.14 не устанавливал тяжёлый CUDA runtime.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "plan-validator-embedding-service"
version = "0.1.0"
description = "Embedding Service Plan Validator."
requires-python = ">=3.12,<3.15"
dependencies = [
    "plan-validator-common==0.1.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "aio-pika==10.0.1",
]

[project.optional-dependencies]
gpu = [
    "accelerate==1.14.0",
    "pillow>=11.3,<12.0",
    "qwen-vl-utils>=0.0.14,<0.1",
    "sentence-transformers==5.4.0",
    "torchvision==0.23.0",
    "transformers==5.16.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_service"]
