# services/catalog-service/pyproject.toml
#
# Installable package Catalog bounded context Plan Validator.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "plan-validator-catalog-service"
version = "0.1.0"
description = "Catalog Service Plan Validator."
requires-python = ">=3.12,<3.15"
dependencies = [
    "plan-validator-common==0.1.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_service"]