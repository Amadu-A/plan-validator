# services/retrieval-service/pyproject.toml
#
# Installable package Retrieval bounded context Plan Validator.

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "plan-validator-retrieval-service"
version = "0.1.0"
description = "Retrieval Service Plan Validator."
requires-python = ">=3.12,<3.15"
dependencies = [
    "plan-validator-common==0.1.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "aio-pika==10.0.1",
    "qdrant-client==1.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_service"]
